{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Register Your Organization</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">Register your organization to get your own isolated task management workspace. Pending approval from the CSG Super Admin.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="mt-4">
                        <button type="submit" class="btn btn-success w-100">Submit Registration</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
