<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4FA3"/>
      <stop offset="100%" stop-color="#FF6FB5"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FF4FA3" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="140" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#innerGlow)"/>
  
  <!-- Modern Task Shield & Checkmark Motif -->
  <path d="M256 80 L390 140 V250 C390 350 256 430 256 430 C256 430 122 350 122 250 V140 L256 80 Z" 
        fill="rgba(255, 255, 255, 0.15)" 
        stroke="#FFFFFF" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <path d="M190 255 L238 303 L325 210" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
