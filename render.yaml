databases:
  - name: csg_db
    databaseName: csg_db
    user: csg_user
    plan: free

services:
  - type: web
    name: csg-web
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn csg_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: csg_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: CLOUDINARY_URL
        sync: false
    disk:
      name: csg_media
      mountPath: /opt/render/project/src/media
      sizeGB: 1

