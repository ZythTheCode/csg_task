databases:
  - name: csg_db
    databaseName: csg_db
    user: csg_user

services:
  - type: web
    name: csg-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn csg_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: csg_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
