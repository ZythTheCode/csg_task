{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Password | CSG Task Management System</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<style>
.form-label { font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
.form-control { border-radius: 10px; border: 1.5px solid #e2e8f0; padding: 11px 14px; font-size: 14px; transition: all 0.2s; }
.btn-login { 
  background: linear-gradient(135deg, #166534, #14532d); 
  color: #fff; border: none; padding: 13px; border-radius: 10px; font-size: 15px; font-weight: 600; width: 100%; transition: all 0.2s; margin-top: 8px; 
}
.btn-login:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(22, 163, 74, 0.35); }
</style>
</head>
<body class="login-page">
<div class="login-card">
<h4 class="fw-bold mb-1 text-center" style="color:#111827">Set New Password</h4>
<p class="text-muted mb-4 text-center" style="font-size:13px">Enter and confirm your new password.</p>
<form method="post">{% csrf_token %}
  {% for field in form %}
  <div class="mb-3">
    <label class="form-label fw-semibold">{{ field.label }}</label>
    <input type="password" name="{{ field.html_name }}" class="form-control {% if field.errors %}is-invalid{% endif %}">
    {% for err in field.errors %}<div class="invalid-feedback">{{ err }}</div>{% endfor %}
  </div>
  {% endfor %}
  <button type="submit" class="btn-login">Set New Password</button>
</form>
</div>
</body>
</html>
