{% extends 'base.html' %}{% block content %}
<div class="row justify-content-center mt-3"><div class="col-md-5">
<div class="card p-4">
  <h5 class="fw-bold mb-1" style="color:var(--primary)"><i class="bi bi-shield-lock me-2"></i>Change Password</h5>
  <p class="text-muted mb-3" style="font-size:13px">Enter your current password and choose a new one.</p>
  <form method="post">{% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
      <label class="form-label fw-semibold" style="font-size:13px">{{ field.label }}</label>
      <div class="password-field-container position-relative">
        <input type="password" name="{{ field.html_name }}" class="form-control {% if field.errors %}is-invalid{% endif %}" data-password-toggle-init="true">
        <button type="button" class="password-toggle-btn" title="Show Password" tabindex="-1" onclick="const input=this.previousElementSibling; const isPwd=input.type==='password'; input.type=isPwd?'text':'password'; this.innerHTML=isPwd?'<i class=\'bi bi-eye\'></i>':'<i class=\'bi bi-eye-slash\'></i>'; this.title=isPwd?'Hide Password':'Show Password'; input.focus();">
          <i class="bi bi-eye-slash"></i>
        </button>
      </div>
      {% for err in field.errors %}<div class="invalid-feedback d-block">{{ err }}</div>{% endfor %}
    </div>
    {% endfor %}
    <button type="submit" class="btn-primary-custom w-100 justify-content-center">Update Password</button>
  </form>
</div></div></div>{% endblock %}
