{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Reset | CSG Task Management System</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<style>
.form-label { font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
.form-control { border-radius: 10px; border: 1.5px solid #e2e8f0; padding: 11px 14px; font-size: 14px; transition: all 0.2s; }
.btn-login { 
  background: linear-gradient(135deg, #166534, #14532d); 
  color: #fff; border: none; padding: 13px; border-radius: 10px; font-size: 15px; font-weight: 600; width: 100%; transition: all 0.2s; margin-top: 8px; 
}
.btn-login:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(22, 163, 74, 0.35); }
</style>
</head>
<body class="login-page">
<div class="login-card">
<h4 class="fw-bold text-center mb-2" style="color:#111827">Forgot Password</h4>
<p class="text-muted text-center mb-4" style="font-size:13px">Enter your email and we'll send a reset link.</p>
<form method="post">{% csrf_token %}
  {% if form.non_field_errors %}
  <div class="alert alert-danger" style="border-radius:10px;font-size:13px;padding:10px;">
    {{ form.non_field_errors.0 }}
  </div>
  {% endif %}
  <div class="mb-3">
    <label class="form-label fw-semibold">Email Address</label>
    <input type="email" name="email" class="form-control {% if form.email.errors %}is-invalid{% endif %}" required value="{{ form.email.value|default:'' }}">
    {% if form.email.errors %}
    <div class="invalid-feedback d-block" style="font-size:12px;">{{ form.email.errors.0 }}</div>
    {% endif %}
  </div>
  <button type="submit" class="btn-login">Send Reset Link</button>
</form>
<div class="text-center mt-3"><a href="{% url 'accounts:login' %}" style="font-size:13px;color:#16a34a;text-decoration:none;font-weight:500">Back to Login</a></div>
</div>
</body>
</html>
