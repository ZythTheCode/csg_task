{% extends 'base.html' %}{% block title %}Edit Profile{% endblock %}{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
<div class="card"><div class="card-header-custom"><h6><i class="bi bi-person-gear me-2"></i>Edit Profile</h6></div>
<div class="p-4"><form method="post" enctype="multipart/form-data">{% csrf_token %}
<div class="row g-3">
  <div class="col-md-6"><label class="form-label fw-semibold" style="font-size:13px">First Name</label><input type="text" name="first_name" value="{{ form.first_name.value }}" class="form-control"></div>
  <div class="col-md-6"><label class="form-label fw-semibold" style="font-size:13px">Last Name</label><input type="text" name="last_name" value="{{ form.last_name.value }}" class="form-control"></div>
  <div class="col-12"><label class="form-label fw-semibold" style="font-size:13px">Email</label><input type="email" name="email" value="{{ form.email.value }}" class="form-control"></div>
  <div class="col-12"><label class="form-label fw-semibold" style="font-size:13px">Phone</label><input type="text" name="phone" value="{{ form.phone.value }}" class="form-control"></div>
  <div class="col-12"><label class="form-label fw-semibold" style="font-size:13px">Bio</label><textarea name="bio" class="form-control" rows="3">{{ form.bio.value }}</textarea></div>
  <div class="col-12"><label class="form-label fw-semibold" style="font-size:13px">Profile Picture</label>{{ form.profile_picture }}</div>
</div>
<hr><div class="d-flex gap-2">
<button type="submit" class="btn-primary-custom"><i class="bi bi-save me-1"></i>Save Changes</button>
<a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary" style="border-radius:8px">Cancel</a>
</div></form></div></div>
</div></div>{% endblock %}
