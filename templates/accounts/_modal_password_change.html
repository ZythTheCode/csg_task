<!-- Change Password Modal -->
<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width:440px">
    <div class="modal-content border-0 shadow-lg" style="border-radius:24px;overflow:hidden">
      <div class="modal-header border-0 pb-0 pt-4 px-4">
        <div class="d-flex align-items-center gap-3">
          <div class="d-flex align-items-center justify-content-center flex-shrink-0"
            style="width:48px;height:48px;border-radius:16px;background:rgba(255,79,163,0.12);color:var(--primary);font-size:22px">
            <i class="bi bi-shield-lock-fill"></i>
          </div>
          <div>
            <h6 class="modal-title fw-bold" id="changePasswordModalLabel" style="color:var(--slate-800);font-size:16px">Change Password</h6>
            <small class="text-muted">Enter your current password and choose a new one</small>
          </div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form id="changePasswordForm" method="post" action="{% url 'accounts:password_change' %}" novalidate>
        {% csrf_token %}
        <div class="modal-body px-4 py-3">
          <div id="changePasswordGlobalError" class="alert alert-danger d-none" style="border-radius:12px;font-size:13px"></div>

          <!-- Current Password -->
          <div class="mb-3">
            <label class="form-label fw-bold text-dark mb-1" style="font-size:12.5px">Current Password <span class="text-danger">*</span></label>
            <div class="password-field-container position-relative">
              <input type="password" name="old_password" id="id_old_password" class="form-control csg-pwd-input"
                placeholder="Enter current password" required
                style="border-radius:12px;font-size:13px;padding-right:2.75rem">
              <button type="button" class="password-toggle-btn" title="Show Password" tabindex="-1" data-target="id_old_password">
                <i class="bi bi-eye-slash"></i>
              </button>
            </div>
            <div id="error_old_password" class="text-danger d-none mt-1" style="font-size:12px"></div>
          </div>

          <!-- New Password -->
          <div class="mb-3">
            <label class="form-label fw-bold text-dark mb-1" style="font-size:12.5px">New Password <span class="text-danger">*</span></label>
            <div class="password-field-container position-relative">
              <input type="password" name="new_password1" id="id_new_password1" class="form-control csg-pwd-input"
                placeholder="Enter new password" required
                style="border-radius:12px;font-size:13px;padding-right:2.75rem">
              <button type="button" class="password-toggle-btn" title="Show Password" tabindex="-1" data-target="id_new_password1">
                <i class="bi bi-eye-slash"></i>
              </button>
            </div>
            <div id="error_new_password1" class="text-danger d-none mt-1" style="font-size:12px"></div>
          </div>

          <!-- Confirm New Password -->
          <div class="mb-2">
            <label class="form-label fw-bold text-dark mb-1" style="font-size:12.5px">Confirm New Password <span class="text-danger">*</span></label>
            <div class="password-field-container position-relative">
              <input type="password" name="new_password2" id="id_new_password2" class="form-control csg-pwd-input"
                placeholder="Confirm new password" required
                style="border-radius:12px;font-size:13px;padding-right:2.75rem">
              <button type="button" class="password-toggle-btn" title="Show Password" tabindex="-1" data-target="id_new_password2">
                <i class="bi bi-eye-slash"></i>
              </button>
            </div>
            <div id="error_new_password2" class="text-danger d-none mt-1" style="font-size:12px"></div>
          </div>
        </div>

        <div class="modal-footer border-0 px-4 pb-4 pt-2 gap-2">
          <button type="button" class="btn btn-secondary-custom px-4" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary-custom px-4" id="changePasswordSubmitBtn">
            <span class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>Update Password
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
(function () {
  // ─── Password visibility toggles ───────────────────────────────────────────
  function bindToggles(root) {
    (root || document).querySelectorAll('.password-toggle-btn[data-target]').forEach(function (btn) {
      if (btn._pwdBound) return;
      btn._pwdBound = true;
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        var input = document.getElementById(btn.getAttribute('data-target'));
        if (!input) return;
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        var icon = btn.querySelector('i');
        if (icon) icon.className = show ? 'bi bi-eye' : 'bi bi-eye-slash';
        btn.title = show ? 'Hide Password' : 'Show Password';
        input.focus();
      });
    });
  }

  // ─── AJAX form submission ───────────────────────────────────────────────────
  function bindSubmit(form) {
    if (!form || form._submitBound) return;
    form._submitBound = true;

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      e.stopPropagation();

      var submitBtn = document.getElementById('changePasswordSubmitBtn');
      var spinner   = submitBtn && submitBtn.querySelector('.spinner-border');
      var globalErr = document.getElementById('changePasswordGlobalError');

      // Reset errors
      if (globalErr) { globalErr.classList.add('d-none'); globalErr.textContent = ''; }
      ['error_old_password', 'error_new_password1', 'error_new_password2'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) { el.classList.add('d-none'); el.textContent = ''; }
      });
      form.querySelectorAll('.form-control.is-invalid').forEach(function (el) { el.classList.remove('is-invalid'); });

      if (submitBtn) submitBtn.disabled = true;
      if (spinner)   spinner.classList.remove('d-none');

      var formData = new FormData(form);

      fetch(form.getAttribute('action'), {
        method: 'POST',
        headers: { 'X-Requested-With': 'XMLHttpRequest' },
        body: formData
      })
      .then(function (res) {
        return res.json().then(function (data) { return { status: res.status, body: data }; });
      })
      .then(function (res) {
        if (submitBtn) submitBtn.disabled = false;
        if (spinner)   spinner.classList.add('d-none');

        if (res.status === 200 && res.body.status === 'ok') {
          // Success — close modal, reset, toast
          var modalEl = document.getElementById('changePasswordModal');
          var modal   = modalEl && bootstrap.Modal.getInstance(modalEl);
          if (modal) modal.hide();
          form.reset();
          if (window.showToastNotification) {
            window.showToastNotification('Password changed successfully.', 'success');
          }
        } else {
          // Validation errors
          var errors = res.body.errors || {};
          var hasField = false;
          Object.keys(errors).forEach(function (field) {
            var errEl   = document.getElementById('error_' + field);
            var inputEl = form.querySelector('[name="' + field + '"]');
            var msg     = Array.isArray(errors[field]) ? errors[field].join(' ') : errors[field];
            if (errEl && inputEl) {
              errEl.textContent = msg;
              errEl.classList.remove('d-none');
              inputEl.classList.add('is-invalid');
              hasField = true;
            }
          });
          if (!hasField && globalErr) {
            globalErr.textContent = (errors.__all__ ? [].concat(errors.__all__).join(' ') : null)
              || res.body.message
              || 'Error updating password. Please check your inputs.';
            globalErr.classList.remove('d-none');
          }
        }
      })
      .catch(function (err) {
        console.error(err);
        if (submitBtn) submitBtn.disabled = false;
        if (spinner)   spinner.classList.add('d-none');
        if (globalErr) { globalErr.textContent = 'Server error. Please try again.'; globalErr.classList.remove('d-none'); }
      });

      return false; // belt-and-suspenders
    });
  }

  // ─── Wire everything up ─────────────────────────────────────────────────────
  // Bootstrap moves the modal element to <body> on first show — we must bind
  // AFTER that move, otherwise the form's submit listener can be lost.
  function init() {
    var modalEl = document.getElementById('changePasswordModal');
    if (!modalEl) return;

    // Bind toggles immediately (they survive DOM moves)
    bindToggles(modalEl);

    // Listen for Bootstrap 'shown.bs.modal' — fires AFTER the modal is moved
    modalEl.addEventListener('shown.bs.modal', function () {
      var form = document.getElementById('changePasswordForm');
      bindToggles(document.body);
      bindSubmit(form);
    });

    // Also try binding immediately in case Bootstrap is not moving the modal
    var form = document.getElementById('changePasswordForm');
    bindSubmit(form);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
