{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Reset Complete | CSG Task Management System</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<style>
.btn-login { 
  background: linear-gradient(135deg, #9d174d, #831843); 
  color: #fff; border: none; padding: 13px; border-radius: 10px; font-size: 15px; font-weight: 600; width: 100%; transition: all 0.2s; margin-top: 8px; display: inline-block; text-decoration: none;
}
.btn-login:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(219, 39, 119, 0.35); color: #fff; }
</style>
</head>
<body class="login-page">
<div class="login-card" style="text-align:center;">
<div style="font-size:48px">✅</div>
<h4 class="fw-bold mt-3" style="color:#111827">Password Reset!</h4>
<p class="text-muted" style="font-size:13px">Your password has been set. You may now log in.</p>
<a href="{% url 'accounts:login' %}" class="btn-login">Sign In Now</a>
</div>
</body>
</html>
