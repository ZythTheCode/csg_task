{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Reset Complete | CSG Task Management System</title>
<link id="dynamicFavicon" rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<script src="{% static 'js/lucide.min.js' %}"></script>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<style>
.login-btn {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff; border: none; padding: 12px; border-radius: 30px;
  font-size: 15px; font-weight: 700; width: 100%; transition: all var(--transition);
  margin-top: 10px; box-shadow: var(--shadow-glow); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
}
.login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(255, 79, 163, 0.45);
  background: linear-gradient(135deg, #FF6FB5, #FF4FA3);
  color: #fff;
}
.login-btn:active { transform: scale(0.97); }
</style>
</head>
<body class="login-page">

<!-- Ambient Animated Background Blobs -->
<div class="bg-ambient-blob bg-blob-1"></div>
<div class="bg-ambient-blob bg-blob-2"></div>
<div class="bg-ambient-blob bg-blob-3"></div>

<div class="login-card" style="text-align:center;">
  <div class="login-logo mx-auto" style="background:var(--success);color:#fff"><i data-lucide="check-circle-2" style="width:28px;height:28px"></i></div>
  <h4>Password Reset!</h4>
  <div class="subtitle mb-4">Your new password has been set successfully. You can now log into your account using your new credentials.</div>

  <a href="{% url 'accounts:login' %}" class="login-btn mt-3"><i data-lucide="log-in" style="width:18px;height:18px"></i>Sign In Now</a>
</div>
<script>
if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
