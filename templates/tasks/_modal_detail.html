<!-- TASK DETAIL MODAL -->
<div class="modal fade" id="taskDetailModal" tabindex="-1" aria-labelledby="taskDetailModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-lg" style="border-radius:24px;overflow:hidden">
      <!-- Modal Header -->
      <div class="modal-header border-0 pb-0 pt-4 px-4 align-items-start">
        <div>
          <div class="d-flex align-items-center gap-2 mb-2">
            <span class="fw-bold" style="color:var(--primary);font-family:monospace;font-size:14px" id="modalTaskNumber">CSG-2026-0001</span>
            <span class="badge-status" id="modalTaskStatus">Status</span>
            <span class="badge-status" id="modalTaskPriority">Priority</span>
          </div>
          <h5 class="fw-bold mb-0" id="modalTaskTitle" style="color:var(--slate-800);line-height:1.3">Task Title</h5>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body px-4 py-3">
        <!-- Spinner -->
        <div id="modalLoadingSpinner" class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="text-muted mt-2 small">Loading task details...</p>
        </div>

        <div id="modalTaskContent" class="d-none">
          <!-- Description -->
          <div class="mb-4 p-3" style="background:var(--pink-50);border-radius:16px;border:1px solid rgba(249, 168, 212, 0.3)">
            <h6 class="fw-bold text-muted mb-2" style="font-size:11px;letter-spacing:0.5px;text-transform:uppercase">Description</h6>
            <div id="modalTaskDescription" style="font-size:14px;color:var(--slate-800);white-space:pre-line"></div>
          </div>

          <div class="row g-3 mb-4">
            <!-- Progress & Dates -->
            <div class="col-md-6">
              <div class="p-3 border rounded-3" style="background:#fff;height:100%">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="fw-semibold text-muted" style="font-size:12px">Progress</span>
                  <span class="fw-bold text-primary" style="font-size:13px" id="modalTaskProgressText">0%</span>
                </div>
                <div class="progress-custom mb-3"><div class="progress-bar bg-primary" id="modalTaskProgressBar" style="width:0%"></div></div>

                <div class="d-flex flex-column gap-2 text-muted" style="font-size:12.5px">
                  <div>Due Date: <strong id="modalTaskDueDate" class="text-dark">—</strong></div>
                  <div>Created By: <strong id="modalTaskCreatedBy" class="text-dark">—</strong></div>
                  <div>Created On: <strong id="modalTaskCreatedAt" class="text-dark">—</strong></div>
                </div>
              </div>
            </div>

            <!-- Assigned Officers -->
            <div class="col-md-6">
              <div class="p-3 border rounded-3" style="background:#fff;height:100%">
                <h6 class="fw-bold text-muted mb-2" style="font-size:11px;letter-spacing:0.5px;text-transform:uppercase">Assigned Officers</h6>
                <div id="modalTaskAssignedList" class="d-flex flex-column gap-2"></div>
              </div>
            </div>
          </div>

          <!-- Attachments & Comments -->
          <div class="row g-3">
            <div class="col-md-6">
              <div class="p-3 border rounded-3" style="background:#fff">
                <h6 class="fw-bold text-muted mb-2" style="font-size:11px;letter-spacing:0.5px;text-transform:uppercase">Attachments</h6>
                <div id="modalTaskAttachmentsList" style="max-height:160px;overflow-y:auto"></div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="p-3 border rounded-3" style="background:#fff">
                <h6 class="fw-bold text-muted mb-2" style="font-size:11px;letter-spacing:0.5px;text-transform:uppercase">Comments</h6>
                <div id="modalTaskCommentsList" style="max-height:160px;overflow-y:auto"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="modal-footer border-top px-4 py-3 d-flex flex-wrap gap-2 justify-content-between align-items-center border-0">
        <a id="modalFullPageBtn" href="#" class="btn btn-secondary-custom btn-sm">Open Full Page</a>
        <div class="d-flex gap-1 flex-wrap ms-auto ms-sm-0">
          <a id="modalEditBtn" href="#" class="btn btn-primary-custom btn-sm d-none">Edit Task</a>
          <button type="button" class="btn btn-secondary-custom btn-sm" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
</div>
